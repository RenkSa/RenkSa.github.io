<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }

        .photo-container {
            position: relative;
            z-index: 10;
            width: 80%;
            max-width: 350px;
            text-align: center;
            margin-bottom: 50px; /* Espaço para o rodapé não cobrir o texto */
        }

        .photo-container img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .neon-text {
            margin-top: 20px;
            font-size: 1.8rem;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 5px #ff1493, 0 0 10px #ff1493, 0 0 20px #ff1493;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }

        .heart {
            position: fixed;
            top: -10%;
            color: #ff69b4;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) translateX(20px) rotate(360deg); }
        }

        footer {
            position: fixed;
            bottom: 15px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="photo-container">
        <img src="WhatsApp Image 2026-04-17 at 11.14.46.jpeg" alt="Sua Foto">
        <div class="neon-text">EU TE AMO MUITOOOOO!!</div>
    </div>

    <footer>
        Por <span style="color: #ff69b4;">Renk Sá</span>
    </footer>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 15 + 15 + "px";
            heart.style.animationDuration = Math.random() * 5 + 5 + "s";
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 10000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
